[tools]
rust = { version = "1.98.1", components = ["rustfmt", "clippy"], targets = ["x86_64-unknown-linux-musl", "x86_64-pc-windows-gnu"] }

[tasks.install-hooks]
run = "git config core.hooksPath .githooks"

[tasks.install-local]
description = "Build and install the searu binary (~/.cargo/bin) and the /searu skill (~/.claude)"
run = [
    "cargo install --path crates/cli --locked",
    "cargo run --quiet -p xtask -- install-skill",
]
