name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli-fmt:
    name: cli/fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- cargo fmt --all --check

  cli-quality:
    name: cli/quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- cargo clippy --all-targets --all-features -- -D warnings

  cli-test:
    name: cli/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- cargo test --all
