name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-fmt:
    name: check/fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- cargo fmt --all --check

  check-quality:
    name: check/quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- cargo clippy --all-targets --all-features -- -D warnings

  check-test:
    name: check/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: mise exec -- cargo test --all

  release-check:
    name: release/check
    needs: [check-fmt, check-quality, check-test]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-plan:
    name: release/plan
    needs: [release-check]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_CREATED: ${{ needs.release-check.outputs.release_created }}
      TAG_NAME: ${{ needs.release-check.outputs.tag_name }}
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Resolve the release channel and version
        id: plan
        run: |
          set -eux
          tags() { gh release list --limit 200 --json tagName --jq '.[].tagName'; }
          if [ "$RELEASE_CREATED" = "true" ]; then
            version="${TAG_NAME#v}"
            {
              echo "channel=release"
              echo "version=${version}"
              echo "tag=${TAG_NAME}"
              echo "publish=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr=$(gh pr list --state open --head release-please--branches--main --json title --jq '.[0].title // ""')
          version=$(printf '%s' "$pr" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          if [ -z "$version" ]; then
            {
              echo "channel=none"
              echo "publish=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="v${version}-rc"
          last=$(tags | grep -E "^${base}[0-9]+$" | sed -E "s/^${base}//" | sort -n | tail -n1 || true)
          number=$(( ${last:-0} + 1 ))
          {
            echo "channel=rc"
            echo "version=${version}-rc${number}"
            echo "tag=${base}${number}"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build/${{ matrix.target }}
    needs: [check-fmt, check-quality, check-test, release-plan]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            ext: tar.gz
            bin: searu
          - target: x86_64-pc-windows-gnu
            ext: zip
            bin: searu.exe
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Build and package ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          BIN: ${{ matrix.bin }}
          SEARU_IMAGE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools gcc-mingw-w64-x86-64 zip
          mise exec -- cargo build --release -p searu --target "$TARGET"
          asset="searu-${TARGET}.${EXT}"
          case "$EXT" in
            tar.gz) tar czf "$asset" -C "target/${TARGET}/release" "$BIN" ;;
            zip) zip -j "$asset" "target/${TARGET}/release/${BIN}" ;;
          esac
          sha256sum "$asset" > "${asset}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: searu-${{ matrix.target }}
          path: |
            searu-${{ matrix.target }}.${{ matrix.ext }}
            searu-${{ matrix.target }}.${{ matrix.ext }}.sha256
          if-no-files-found: error

  release:
    name: release
    needs: [build, release-plan]
    if: ${{ github.event_name == 'push' && needs.release-plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      CHANNEL: ${{ needs.release-plan.outputs.channel }}
      VERSION: ${{ needs.release-plan.outputs.version }}
      TAG: ${{ needs.release-plan.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish release or candidate
        run: |
          set -eux
          cd dist
          assets="searu-x86_64-unknown-linux-musl.tar.gz searu-x86_64-unknown-linux-musl.tar.gz.sha256 searu-x86_64-pc-windows-gnu.zip searu-x86_64-pc-windows-gnu.zip.sha256"
          tags() { gh release list --limit 200 --json tagName --jq '.[].tagName'; }
          if [ "$CHANNEL" = "release" ]; then
            gh release upload "$TAG" $assets --clobber
            for tag in $(tags | grep -E "^v${VERSION}-rc[0-9]+$" || true); do
              gh release delete "$tag" --cleanup-tag --yes || true
            done
          else
            base="${VERSION%-rc*}"
            number="${VERSION##*-rc}"
            body=$(gh pr list --state open --head release-please--branches--main --json body --jq '.[0].body // ""')
            changelog=$(printf '%s\n' "$body" | awk '/^---$/{n++; next} n==1{print}')
            {
              printf 'Release candidate %s for v%s, built from main.\n' "$number" "$base"
              if [ -n "$changelog" ]; then printf '\n%s\n' "$changelog"; fi
            } > rc-notes.md
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "$TAG" --notes-file rc-notes.md \
              $assets
          fi

  images-prep:
    name: images/prep
    needs: [build, release-plan]
    if: ${{ github.event_name == 'push' && needs.release-plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: searu-x86_64-unknown-linux-musl
          path: bin
      - name: Export the per-tool build contexts
        id: list
        run: |
          set -eux
          tar xzf bin/searu-x86_64-unknown-linux-musl.tar.gz -C bin
          ./bin/searu image export --dir contexts
          tools=$(ls contexts | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "tools=${tools}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: image-contexts
          path: contexts
          if-no-files-found: error

  images-push:
    name: images/${{ matrix.tool }}
    needs: [images-prep, release-plan]
    if: ${{ github.event_name == 'push' && needs.release-plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.images-prep.outputs.tools) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-contexts
          path: contexts
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: contexts/${{ matrix.tool }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/searu-${{ matrix.tool }}:${{ needs.release-plan.outputs.version }}
          cache-from: type=gha,scope=searu-${{ matrix.tool }}
          cache-to: type=gha,mode=max,scope=searu-${{ matrix.tool }}
