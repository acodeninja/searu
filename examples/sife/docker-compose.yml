services:
  api:
    build: .
    ports:
      - '8080:8080'
    environment:
      PORT: 8080
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: sife
      PGPASSWORD: sife
      PGDATABASE: sife
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: sife
      JWT_SECRET: sife-signing-key
      SESSION_SECRET: sife-session
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sife
      POSTGRES_PASSWORD: sife
      POSTGRES_DB: sife
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sife']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
